[package]
name = "workpot-tray"
version = "0.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Workpot macOS menu bar tray"

[lints]
workspace = true

[lib]
name = "workpot_tray_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "workpot-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = { workspace = true }
git2 = { version = "0.21", features = ["vendored-libgit2"] }
env_logger = "0.11.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
workpot-core = { path = "../crates/workpot-core", version = "0.0.8" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSButton",
  "NSControl",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSGeometry",
  "NSString",
] }
window-vibrancy = "0.8"

# Opt-in AppKit regression test: needs the main thread (no libtest harness) and a real menu
# bar. Skips unless WORKPOT_GUI_TESTS=1 (`just test-gui`).
[[test]]
name = "tray_menu_gui"
harness = false

[dev-dependencies]
tempfile = "3"
workpot-core = { path = "../crates/workpot-core", version = "0.0.8" }
